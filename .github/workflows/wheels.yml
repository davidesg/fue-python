name: Build wheels

# Builds cp310-cp314 binary wheels (Linux x86_64+aarch64, macOS arm64 and
# x86_64, Windows AMD64) with GSL bundled, plus the pure-Python wheel and the
# sdist. Runs on demand (workflow_dispatch) for validation; publishes to PyPI
# on v* tags.
#
# macOS: macosx_11_0 wheels for both processors, as atsw-gui's .dmg (macOS 11
# on Apple Silicon and Intel). arm64 on macos-15, x86_64 on macos-15-intel;
# GSL compiled from source for 11.0 (tools/build_gsl.sh, pyproject's
# [tool.cibuildwheel.macos]), and tools/check_macos_minos.py stops the
# workflow if any binary in a wheel asks for a newer macOS. Up to 0.1.19 only
# macosx_14_0_arm64 was built (on macos-14, retired by GitHub on 2-nov-2026),
# and an Intel Mac got the pure-Python wheel.

on:
  push:
    tags:
      - "v*"          # build + publish on version tags
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners PINNED (not macos-latest), each building its own
        # architecture; the deployment target is the wheel's tag and the GSL's.
        include:
          - os: ubuntu-latest     # Linux x86_64 (+ aarch64 via QEMU)
          - os: macos-15          # macOS Apple Silicon arm64
            macos_target: "11.0"
          - os: macos-15-intel    # macOS Intel x86_64
            macos_target: "11.0"
          - os: windows-latest    # Windows x86_64 (AMD64)

    steps:
      - uses: actions/checkout@v4

      # QEMU lets cibuildwheel build aarch64 wheels on x86_64 GitHub runners.
      - name: Set up QEMU (Linux only)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: aarch64

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # Build aarch64 on Linux as well as x86_64
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          # macOS only (empty elsewhere): the wheel's tag, and the minimum the
          # GSL and the extension are compiled for.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - name: No binary asks for a newer macOS than the tag (macOS)
        if: runner.os == 'macOS'
        run: python3 tools/check_macos_minos.py "${{ matrix.macos_target }}" wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ── Pure-Python wheel (no C extension, no GSL required) ──────────────────
  build_pure_wheel:
    name: Pure-Python wheel (no C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build
        run: pip install build

      - name: Build pure-Python wheel
        run: python -m build --wheel
        env:
          FUE_SKIP_C: "1"

      - name: Smoke-test pure wheel
        run: |
          pip install "dist/fue-"*"-py3-none-any.whl" pytest
          pytest tests/test_smoke.py -q   # smoke only; golden battery is platform-sensitive

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure
          path: dist/fue-*-py3-none-any.whl

  # ── Source distribution ────────────────────────────────────────────────────
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI on version tags ───────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_pure_wheel, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"   # wheels-ubuntu-latest, wheels-macos-15, wheels-macos-15-intel, wheels-windows-latest, wheels-pure
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
